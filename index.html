<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام غرف المؤتمر</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0b0c2e; min-height: 100vh; display: flex; justify-content: center; padding: 30px; color: #fff; }
        .app { max-width: 900px; width: 100%; }
        .card { background: rgba(255,255,255,0.07); backdrop-filter: blur(12px); border-radius: 30px; padding: 25px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        h2 { margin-bottom: 20px; font-weight: 300; color: #c4b5fd; border-right: 4px solid #a78bfa; padding-right: 15px; }
        .flex-row { display: flex; flex-wrap: wrap; gap: 15px; align-items: center; }
        .flex-row input, .flex-row select { flex: 1; min-width: 150px; }
        input, select, button { padding: 14px 18px; border: none; border-radius: 60px; background: rgba(255,255,255,0.06); color: #fff; font-size: 15px; outline: 1px solid rgba(255,255,255,0.1); transition: 0.3s; }
        input:focus, select:focus { outline: 2px solid #a78bfa; background: rgba(255,255,255,0.12); }
        button { background: linear-gradient(135deg, #7c3aed, #a78bfa); font-weight: bold; cursor: pointer; }
        button:hover { transform: scale(1.02); box-shadow: 0 8px 25px #7c3aed80; }
        .btn-danger { background: #ef4444; }
        .btn-outline { background: transparent; border: 1px solid #a78bfa; }
        .hidden { display: none !important; }

        /* Avatar & User Row */
        .user-row { display: flex; align-items: center; gap: 15px; background: rgba(255,255,255,0.04); padding: 12px 18px; border-radius: 60px; margin-bottom: 10px; border-right: 3px solid #a78bfa; }
        .avatar { width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg, #4f46e5, #a78bfa); display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: bold; color: #fff; flex-shrink: 0; }
        .user-info { flex: 1; }
        .user-info .name { font-weight: bold; font-size: 18px; }
        .user-info .sub { font-size: 13px; color: #9ca3af; }
        .badge-role { padding: 4px 14px; border-radius: 40px; font-size: 12px; font-weight: bold; }
        .badge-server { background: #f59e0b; color: #1e1b2e; }
        .badge-client { background: #34d399; color: #1e1b2e; }
        .points-control { display: flex; gap: 8px; align-items: center; }
        .points-control button { width: 40px; height: 40px; padding: 0; border-radius: 50%; font-size: 20px; background: #374151; }
        .points-control button.plus { background: #22c55e; }
        .points-control button.minus { background: #ef4444; }

        /* Rooms Grid */
        .rooms-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .room-card { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 20px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
        .room-card .num { font-size: 28px; font-weight: bold; color: #a78bfa; }
        .room-card .count { font-size: 14px; color: #9ca3af; }

        /* Stats table */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
        .stat-item { background: rgba(255,255,255,0.04); padding: 15px; border-radius: 16px; text-align: center; }
        .stat-item .val { font-size: 28px; font-weight: bold; color: #fcd34d; }
        .stat-item .lbl { font-size: 13px; color: #9ca3af; }

        .alert-box { background: #f43f5e; padding: 12px; border-radius: 30px; margin: 10px 0; text-align: center; animation: fade 0.5s; }
        @keyframes fade { from { opacity:0; transform:translateY(-10px); } to { opacity:1; } }
        .small-text { font-size: 13px; color: #9ca3af; }
        hr { margin: 20px 0; border-color: rgba(255,255,255,0.05); }
    </style>
</head>
<body>
<div class="app" id="app">

    <!-- ========== صفحة تسجيل الدخول ========== -->
    <div id="loginPage" class="card">
        <h2>🔐 دخول المؤتمر</h2>
        <div class="flex-row">
            <select id="roleSelect">
                <option value="server">🧑‍💼 خادم (مشرف غرفة)</option>
                <option value="client">🧑‍🎓 مخدوم (حاجز)</option>
            </select>
            <input type="text" id="fullName" placeholder="الاسم الثلاثي (مثال: أحمد محمد علي)" />
            <input type="tel" id="userPhone" placeholder="رقم التليفون" />
        </div>
        <div class="flex-row">
            <input type="number" id="roomNumber" placeholder="رقم الغرفة (1-5)" min="1" max="5" />
            <button onclick="signIn()">دخول / تسجيل</button>
        </div>
        <p id="loginError" class="small-text" style="color:#f87171;"></p>
    </div>

    <!-- ========== صفحة الخادم ========== -->
    <div id="serverPage" class="hidden">
        <div class="card">
            <div class="flex-row" style="justify-content:space-between;">
                <div class="user-row" style="background:transparent; padding:0; border:0;">
                    <div class="avatar" id="serverAvatar">خ</div>
                    <div><div class="name" id="serverName">---</div><div class="sub">🛡️ خادم الغرفة <span id="serverRoomNum">0</span></div></div>
                </div>
                <button onclick="logout()" class="btn-danger" style="padding:8px 20px;">🚪 خروج</button>
            </div>
        </div>

        <!-- لوحة الغرف -->
        <div class="card">
            <h2>🏠 الغرف المتاحة</h2>
            <div class="rooms-grid" id="roomsContainer"></div>
        </div>

        <!-- قائمة المخدومين في غرفتي -->
        <div class="card">
            <h2>👥 مخدومي غرفتي (العدد: <span id="clientCount">0</span>)</h2>
            <div id="clientsList"></div>
        </div>

        <!-- إحصائيات -->
        <div class="card">
            <h2>📊 إحصائيات النقاط</h2>
            <div class="stats-grid" id="statsContainer">
                <div class="stat-item"><div class="val" id="statTotal">0</div><div class="lbl">إجمالي النقاط</div></div>
                <div class="stat-item"><div class="val" id="statAvg">0</div><div class="lbl">المتوسط</div></div>
                <div class="stat-item"><div class="val" id="statMax">0</div><div class="lbl">أعلى نقطة</div></div>
            </div>
            <div style="margin-top:10px; font-size:14px; color:#9ca3af;" id="statPercentage">نسبة التقدم: 0%</div>
        </div>
    </div>

    <!-- ========== صفحة المخدوم ========== -->
    <div id="clientPage" class="hidden">
        <div class="card">
            <div class="flex-row" style="justify-content:space-between;">
                <div class="user-row" style="background:transparent; padding:0; border:0;">
                    <div class="avatar" id="clientAvatar">م</div>
                    <div><div class="name" id="clientName">---</div><div class="sub">🚪 غرفة <span id="clientRoomNum">0</span> • ⭐ نقاط: <strong id="clientPoints">0</strong></div></div>
                </div>
                <button onclick="logout()" class="btn-danger" style="padding:8px 20px;">🚪 خروج</button>
            </div>
            <div id="clientNotification" class="hidden alert-box">🔔 لديك إشعار جديد!</div>
            <div id="clientHistory" style="margin-top:15px; background:rgba(255,255,255,0.03); padding:15px; border-radius:20px;">
                <span class="small-text">📝 آخر تحديث: <span id="lastUpdateBy">لا يوجد</span></span>
            </div>
        </div>
        <!-- عرض بسيط للغرفة التي فيها -->
        <div class="card">
            <h2>👥 أعضاء غرفتي</h2>
            <div id="clientRoomMembers"></div>
        </div>
    </div>

</div>

<script>
    // ===== إعدادات Firebase (ضع بيانات مشروعك هنا) =====
    const firebaseConfig = {
        apiKey: "AIzaSyDemoKey_123456789",
        authDomain: "your-project.firebaseapp.com",
        projectId: "your-project",
        storageBucket: "your-project.appspot.com",
        messagingSenderId: "123456789",
        appId: "1:123456789:web:abcdef"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // ===== متغيرات عامة =====
    let currentUser = null; // { uid, name, phone, role, roomNumber, points }

    // ===== دوال مساعدة =====
    function getAvatarChar(name) {
        if (!name) return '👤';
        const parts = name.trim().split(' ');
        if (parts.length >= 3) return parts[0][0] + parts[1][0];
        return name[0] || '👤';
    }

    // ===== تسجيل الدخول =====
    window.signIn = async function() {
        const name = document.getElementById('fullName').value.trim();
        const phone = document.getElementById('userPhone').value.trim();
        const role = document.getElementById('roleSelect').value;
        const room = parseInt(document.getElementById('roomNumber').value);
        const err = document.getElementById('loginError');

        if (!name || !phone || !room) { err.innerText = '❗ املأ جميع الحقول'; return; }
        if (room < 1 || room > 5) { err.innerText = '❗ رقم الغرفة من 1 إلى 5'; return; }

        try {
            const cred = await auth.signInAnonymously();
            const uid = cred.user.uid;

            const userRef = db.collection('users').doc(uid);
            await userRef.set({ name, phone, role, roomNumber: room, points: 0 }, { merge: true });

            // --- إدارة الغرف (Firestore) ---
            const roomRef = db.collection('rooms').doc(String(room));
            const roomDoc = await roomRef.get();
            let members = [];
            let serverId = null;

            if (roomDoc.exists) {
                const data = roomDoc.data();
                members = data.members || [];
                serverId = data.serverId || null;
            }

            if (role === 'server') {
                // لو خادم: يشترط ألا يكون للغرفة خادم بالفعل
                if (serverId && serverId !== uid) {
                    err.innerText = '❌ هذه الغرفة لها خادم بالفعل! اختر غرفة أخرى.';
                    return;
                }
                await roomRef.set({ serverId: uid, members: members }, { merge: true });
            } else { // client
                if (members.length >= 5) {
                    err.innerText = '❌ الغرفة ممتلئة (5 أشخاص)! اختر غرفة أخرى.';
                    return;
                }
                if (!members.includes(uid)) members.push(uid);
                await roomRef.set({ serverId: serverId, members: members }, { merge: true });
            }

            // جلب البيانات المحدثة
            const doc = await userRef.get();
            currentUser = { uid, ...doc.data() };
            err.innerText = '';

            if (role === 'server') showServerPage();
            else showClientPage();

        } catch (e) {
            err.innerText = '❌ خطأ: ' + e.message;
        }
    };

    // ===== عرض صفحات =====
    function showServerPage() {
        document.getElementById('loginPage').classList.add('hidden');
        document.getElementById('serverPage').classList.remove('hidden');
        document.getElementById('clientPage').classList.add('hidden');

        document.getElementById('serverName').innerText = currentUser.name;
        document.getElementById('serverAvatar').innerText = getAvatarChar(currentUser.name);
        document.getElementById('serverRoomNum').innerText = currentUser.roomNumber;

        loadRooms();
        loadClients();
        loadStats();
    }

    function showClientPage() {
        document.getElementById('loginPage').classList.add('hidden');
        document.getElementById('clientPage').classList.remove('hidden');
        document.getElementById('serverPage').classList.add('hidden');

        document.getElementById('clientName').innerText = currentUser.name;
        document.getElementById('clientAvatar').innerText = getAvatarChar(currentUser.name);
        document.getElementById('clientRoomNum').innerText = currentUser.roomNumber;
        document.getElementById('clientPoints').innerText = currentUser.points || 0;

        // إشعار
        document.getElementById('clientNotification').classList.remove('hidden');
        setTimeout(() => document.getElementById('clientNotification').classList.add('hidden'), 5000);

        loadClientRoomMembers();
        loadClientHistory();
    }

    // ===== تحميل الغرف للخادم =====
    async function loadRooms() {
        const container = document.getElementById('roomsContainer');
        container.innerHTML = 'جار التحميل...';
        try {
            const snap = await db.collection('rooms').get();
            let html = '';
            snap.forEach(doc => {
                const data = doc.data();
                const members = data.members || [];
                const serverId = data.serverId || 'لا يوجد';
                html += `<div class="room-card">
                    <div class="num">🚪 ${doc.id}</div>
                    <div>👥 ${members.length}/5</div>
                    <div class="small-text">خادم: ${serverId === currentUser.uid ? 'أنت' : (serverId ? 'موجود' : 'متاح')}</div>
                </div>`;
            });
            container.innerHTML = html || 'لا توجد غرف';
        } catch (e) { container.innerHTML = 'خطأ في التحميل'; }
    }

    // ===== تحميل المخدومين في غرفة الخادم =====
    async function loadClients() {
        const list = document.getElementById('clientsList');
        const countSpan = document.getElementById('clientCount');
        try {
            const roomDoc = await db.collection('rooms').doc(String(currentUser.roomNumber)).get();
            const members = roomDoc.exists ? (roomDoc.data().members || []) : [];
            countSpan.innerText = members.length;

            if (members.length === 0) { list.innerHTML = '<div class="small-text">لا يوجد مخدومين بعد</div>'; return; }

            let html = '';
            for (const uid of members) {
                const userSnap = await db.collection('users').doc(uid).get();
                if (!userSnap.exists) continue;
                const data = userSnap.data();
                html += `
                    <div class="user-row">
                        <div class="avatar">${getAvatarChar(data.name)}</div>
                        <div class="user-info">
                            <div class="name">${data.name}</div>
                            <div class="sub">📞 ${data.phone} • نقاط: ${data.points || 0}</div>
                        </div>
                        <div class="points-control">
                            <button class="plus" onclick="updatePoint('${uid}', 1)">+</button>
                            <button class="minus" onclick="updatePoint('${uid}', -1)">-</button>
                        </div>
                    </div>
                `;
            }
            list.innerHTML = html;
        } catch (e) { list.innerHTML = 'خطأ: ' + e.message; }
    }

    // ===== تحديث النقاط (خادم) =====
    window.updatePoint = async function(clientUid, delta) {
        if (!currentUser || currentUser.role !== 'server') return;
        try {
            const userRef = db.collection('users').doc(clientUid);
            const doc = await userRef.get();
            if (!doc.exists) return;
            const currentPoints = doc.data().points || 0;
            const newPoints = currentPoints + delta;
            await userRef.update({ points: newPoints });

            // تسجيل الإشعار (مين عمل التحديث)
            await db.collection('notifications').add({
                userId: clientUid,
                message: `🔄 تم ${delta > 0 ? 'إضافة' : 'خصم'} ${Math.abs(delta)} نقطة بواسطة ${currentUser.name}`,
                performer: currentUser.name,
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                read: false
            });

            // تحديث واجهة الخادم (القائمة)
            loadClients();
            loadStats();
            // لو المخدوم هو نفسه فتحت صفحته (نادر) هنحدثها لو هو
            if (clientUid === currentUser.uid) {
                currentUser.points = newPoints;
                document.getElementById('clientPoints').innerText = newPoints;
            }
        } catch (e) { alert('خطأ: ' + e.message); }
    };

    // ===== الإحصائيات =====
    async function loadStats() {
        try {
            const snap = await db.collection('users').where('role', '==', 'client').get();
            let points = [];
            snap.forEach(d => points.push(d.data().points || 0));
            const total = points.reduce((a,b) => a+b, 0);
            const avg = points.length ? (total / points.length).toFixed(1) : 0;
            const max = points.length ? Math.max(...points) : 0;

            document.getElementById('statTotal').innerText = total;
            document.getElementById('statAvg').innerText = avg;
            document.getElementById('statMax').innerText = max;

            // نسبة (لو افترضنا أن الهدف 100 نقطة مثلاً)
            const maxPossible = 100;
            const pct = Math.min(100, ((total / (points.length || 1)) / maxPossible) * 100).toFixed(0);
            document.getElementById('statPercentage').innerHTML = `📈 نسبة التقدم (متوسط النقاط إلى 100): ${pct}%`;
        } catch (e) { console.error(e); }
    }

    // ===== للمخدوم: عرض أعضاء غرفته =====
    async function loadClientRoomMembers() {
        const container = document.getElementById('clientRoomMembers');
        try {
            const roomDoc = await db.collection('rooms').doc(String(currentUser.roomNumber)).get();
            const members = roomDoc.exists ? (roomDoc.data().members || []) : [];
            if (members.length === 0) { container.innerHTML = '<div class="small-text">لا يوجد أعضاء</div>'; return; }
            let html = '';
            for (const uid of members) {
                const snap = await db.collection('users').doc(uid).get();
                if (!snap.exists) continue;
                const data = snap.data();
                const isMe = uid === currentUser.uid;
                html += `<div class="user-row" style="${isMe ? 'border-right-color: #fcd34d;' : ''}">
                    <div class="avatar">${getAvatarChar(data.name)}</div>
                    <div><div class="name">${data.name} ${isMe ? '⭐' : ''}</div>
                    <div class="sub">نقاط: ${data.points || 0}</div></div>
                </div>`;
            }
            container.innerHTML = html;
        } catch (e) { container.innerHTML = 'خطأ'; }
    }

    // ===== للمخدوم: تاريخ آخر تحديث =====
    async function loadClientHistory() {
        try {
            const snap = await db.collection('notifications')
                .where('userId', '==', currentUser.uid)
                .orderBy('timestamp', 'desc')
                .limit(1)
                .get();
            if (!snap.empty) {
                const data = snap.docs[0].data();
                document.getElementById('lastUpdateBy').innerText = data.performer || 'مجهول';
            } else {
                document.getElementById('lastUpdateBy').innerText = 'لا يوجد تحديثات';
            }
        } catch (e) { /* ignore */ }
    }

    // ===== خروج =====
    window.logout = function() { auth.signOut(); location.reload(); };

    // ===== استعادة الجلسة =====
    auth.onAuthStateChanged(async (user) => {
        if (user) {
            const doc = await db.collection('users').doc(user.uid).get();
            if (doc.exists) {
                currentUser = { uid: user.uid, ...doc.data() };
                if (currentUser.role === 'server') showServerPage();
                else showClientPage();
            }
        }
    });

    // تحديث دوري (كل 5 ثواني) للخادم عشان يشوف التغييرات
    setInterval(() => {
        if (currentUser && currentUser.role === 'server') {
            loadClients();
            loadStats();
            loadRooms();
        }
    }, 5000);
</script>
</body>
</html>
