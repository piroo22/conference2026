<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مؤتمر أبطال الإيمان 2026</title>
  <!-- مكتبة قراءة الـ QR Code عبر الكاميرا -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; }
    
    /* خلفية الطبيعة والماء والسماء مع انيميشن حركة هادئة */
    body { 
      background: linear-gradient(180deg, #6dd5ed 0%, #2193b0 50%, #11998e 75%, #38ef7d 100%);
      background-size: 100% 200%;
      animation: skyAnimation 12s ease infinite alternate;
      color: #1a202c; 
      padding: 15px; 
      min-height: 100vh;
      position: relative;
    }

    @keyframes skyAnimation {
      0% { background-position: 0% 0%; }
      100% { background-position: 0% 100%; }
    }

    /* الصليب المائي البارز على الجانب */
    .side-cross {
      position: fixed;
      top: 10%;
      left: 5%;
      font-size: 180px;
      color: rgba(255, 255, 255, 0.25);
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
      pointer-events: none;
      z-index: 0;
    }

    .container { max-width: 750px; margin: auto; position: relative; z-index: 1; }

    /* تصميم Glassmorphism شفاف مثل أبل */
    .glass-card {
      background: rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 24px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
    }

    .header-title { text-align: center; color: #0f4c81; font-size: 28px; font-weight: 800; }
    
    /* التبويبات والأزرار */
    .nav-tabs { display: flex; gap: 8px; margin-bottom: 15px; overflow-x: auto; }
    .nav-btn { 
      flex: 1; padding: 12px; border: none; background: rgba(255, 255, 255, 0.5); 
      color: #0f4c81; border-radius: 14px; cursor: pointer; font-weight: bold; font-size: 15px;
    }
    .nav-btn.active { background: #0f4c81; color: #fff; }

    input, select, button.action-btn { 
      width: 100%; padding: 14px; margin-top: 10px; border-radius: 12px; 
      border: 1px solid rgba(255,255,255,0.7); background: rgba(255,255,255,0.8); 
      font-size: 16px; font-weight: bold; color: #2d3748; outline: none;
    }
    button.action-btn { background: #0f4c81; color: #fff; border: none; cursor: pointer; }

    /* الكاميرا وشاشة الماسح */
    #reader { width: 100%; border-radius: 15px; overflow: hidden; margin-top: 10px; }

    .reader-frame {
      width: 100%; height: 60vh; border: none; border-radius: 15px; background: #fff;
    }
  </style>
</head>
<body>

<div class="side-cross">┼</div>

<div class="container">
  <div class="glass-card">
    <h1 class="header-title">مؤتمر أبطال الإيمان 2026</h1>
  </div>

  <!-- تسجيل دخول منظم -->
  <div class="glass-card" id="auth-box">
    <h3 style="margin-bottom:15px; text-align:center;">تسجيل البيانات</h3>
    
    <label>الرتبة:</label>
    <select id="user-role" onchange="toggleRoleUI()">
      <option value="guest">مخدوم</option>
      <option value="host">خادم</option>
    </select>

    <label style="margin-top:10px; display:block;">الاسم بالكامل:</label>
    <input type="text" id="username" placeholder="اكتب اسمك">

    <label style="margin-top:10px; display:block;">رقم الموبايل:</label>
    <input type="tel" id="user-phone" placeholder="01xxxxxxxxx">

    <label style="margin-top:10px; display:block;">الفصل / المجموعة:</label>
    <select id="user-class">
      <option value="1">فصل 1 (أرسلها لي لتحديد الأسماء)</option>
      <option value="2">فصل 2</option>
    </select>

    <button class="action-btn" onclick="login()">دخول للمؤتمر</button>
  </div>

  <!-- المحتوى للتطبيقات -->
  <div id="app-content" style="display: none;">
    <div class="nav-tabs">
      <button class="nav-btn active" onclick="showTab('main-tab')">الرئيسية</button>
      <button class="nav-btn" onclick="showTab('bible-tab')">الإنجيل الكامل</button>
      <button class="nav-btn" onclick="showTab('agpeya-tab')">الأجبية كاملة</button>
      <button class="nav-btn host-only" onclick="showTab('admin-tab')" style="display:none;">لوحة الخادم</button>
    </div>

    <!-- 1. الرئيسية -->
    <div id="main-tab" class="tab-content">
      <div class="glass-card guest-only">
        <h3 style="text-align:center;">نقاطك الحالية: <span id="my-points" style="color:#0f4c81; font-size:32px;">0</span></h3>
      </div>
      <div class="glass-card">
        <h3>تسكين الأوضة</h3>
        <input type="text" id="room-num" placeholder="رقم غرفتك">
        <button class="action-btn" onclick="alert('تم حفظ رقم الأوضة')">حفظ الأوضة</button>
      </div>
    </div>

    <!-- 2. الإنجيل الكامل والقطمارس من مصدر رسمي كنسي مباشرة -->
    <div id="bible-tab" class="tab-content" style="display: none;">
      <div class="glass-card">
        <h3>الكتاب المقدس الكامل (تصفح وقراءة)</h3>
        <iframe class="reader-frame" src="https://st-takla.org/pub_Deut/Deut_Read-Holy-Bible_.html"></iframe>
      </div>
    </div>

    <!-- 3. الأجبية كاملة -->
    <div id="agpeya-tab" class="tab-content" style="display: none;">
      <div class="glass-card">
        <h3>صلوات الأجبية كاملة</h3>
        <iframe class="reader-frame" src="https://st-takla.org/Agpeya_.html"></iframe>
      </div>
    </div>

    <!-- 4. أدوات الخادم: مسح الكود بالكاميرا وإضافة النقاط والبحث والتسكين -->
    <div id="admin-tab" class="tab-content" style="display: none;">
      <!-- الماسح الضوئي (الكاميرا) -->
      <div class="glass-card">
        <h3>فتح الكاميرا لقرّاءة QR Code المخدوم</h3>
        <button class="action-btn" onclick="startScanner()">تشغيل الكاميرا الآن</button>
        <div id="reader"></div>
        <p id="scanner-result" style="margin-top:10px; font-weight:bold; color:#0f4c81;"></p>
      </div>

      <!-- البحث اليدوي وإضافة النقاط -->
      <div class="glass-card">
        <h3>بحث وإضافة النقاط</h3>
        <input type="text" id="search-user" placeholder="ابحث باسم المخدوم أو الكود...">
        <input type="number" id="add-pts-val" placeholder="عدد النقاط">
        <button class="action-btn" onclick="grantPoints()">إضافة النقاط</button>
      </div>

      <!-- إدخال وتعديل التسكين -->
      <div class="glass-card">
        <h3>إدارة تسكين الغرف</h3>
        <input type="text" id="target-room-user" placeholder="اسم المخدوم">
        <input type="text" id="target-room-no" placeholder="رقم الغرفة">
        <button class="action-btn" onclick="alert('تم تحديث غرفة المخدوم')">تسكين في الغرفة</button>
      </div>
    </div>

  </div>
</div>

<script>
  function login() {
    const name = document.getElementById('username').value;
    const role = document.getElementById('user-role').value;
    if(!name) return alert('يرجى أدخال الاسم');

    document.getElementById('auth-box').style.display = 'none';
    document.getElementById('app-content').style.display = 'block';

    if(role === 'host') {
      document.querySelectorAll('.host-only').forEach(e => e.style.display = 'block');
      document.querySelectorAll('.guest-only').forEach(e => e.style.display = 'none');
    }
  }

  function showTab(id) {
    document.querySelectorAll('.tab-content').forEach(e => e.style.display = 'none');
    document.querySelectorAll('.nav-btn').forEach(e => e.classList.remove('active'));
    document.getElementById(id).style.display = 'block';
    event.target.classList.add('active');
  }

  /* تشغيل كاميرا الهاتف لقرّاءة الـ QR Code */
  function startScanner() {
    const html5LtCode = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
    html5LtCode.render((decodedText) => {
      document.getElementById('scanner-result').innerText = "تم مسح الكود: " + decodedText;
      document.getElementById('search-user').value = decodedText;
      html5LtCode.clear();
    });
  }

  function grantPoints() {
    const u = document.getElementById('search-user').value;
    const p = document.getElementById('add-pts-val').value;
    if(u && p) alert(`تم إضافة ${p} نقطة للمخدوم: ${u}`);
  }
</script>
</body>
</html>
